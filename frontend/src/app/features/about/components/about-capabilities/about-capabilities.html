<section class="section">
  <div class="container">
    <div class="text-center">
      <span class="section-label">Core Capabilities</span>
      <h2 class="section-title">What We Deliver</h2>
    </div>

    <div class="capabilities-grid">
      @for (capability of capabilities; track capability.title) {
        <article class="card capability-card">
          <h3>{{ capability.title }}</h3>
          <p>{{ capability.text }}</p>
        </article>
      }
    </div>
  </div>
</section>
