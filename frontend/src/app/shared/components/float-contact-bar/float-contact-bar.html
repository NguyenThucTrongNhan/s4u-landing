<div class="float-bar">
  <a [href]="phoneHref" class="float-btn float-phone" title="Call us">
    <span class="float-icon">📞</span>
    <span class="float-label">Call</span>
  </a>
  <a [href]="zaloHref" target="_blank" rel="noopener noreferrer" class="float-btn float-zalo" title="Chat on Zalo">
    <span class="float-zalo-icon">Z</span>
    <span class="float-label">Zalo</span>
  </a>
  <a [href]="mailHref" class="float-btn float-email" title="Email us">
    <span class="float-icon">✉️</span>
    <span class="float-label">Email</span>
  </a>
</div>
